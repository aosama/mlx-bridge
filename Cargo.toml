[package]
name = "mlx-c-rust"
# Pre-release while the extracted bridge is in its shakedown period; the
# stable release lands once early adopters have exercised it. Pre-releases
# are never resolved by default dependency resolution, so nobody gets an
# early build accidentally.
version = "0.32.4-alpha.4"
edition = "2024"
# The crate version names the MLX RELEASE THE CRATE IS VERIFIED AGAINST —
# the number users search for and install (the scheme mlx-rs established for
# user-facing crates; only internal sys layers version by MLX-C). MLX-C is
# the carrier for the C bridge, not the pace-setter: this release binds the
# MLX-C v0.8.0 headers, the release pairing with MLX v0.32.4. Where a pairing
# lags, this repository's reviewed forward edits (native_forward_edits.rs) and
# gap shim (native_gap_shim/) cover the difference. The bound pair is recorded
# here, in the README, and in COVERAGE_INVENTORY.md. MLX occupies all three
# numeric slots, so our own fixes and same-MLX MLX-C surface changes advance
# the pre-release counter (0.32.4-alpha.N), surface changes with an inventory
# note; RELEASES.md records what the first stable release must settle.
rust-version = "1.101"
description = "A complete, low-level, policy-free Rust bridge to the MLX-C API of Apple's MLX for Apple silicon, tracking MLX releases. Version = the verified MLX release (0.32.4; binds MLX-C 0.8)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/aosama/mlx-c-rust"
documentation = "https://docs.rs/mlx-c-rust"
readme = "README.md"
keywords = ["mlx", "apple-silicon", "machine-learning", "bindings", "gpu"]
categories = ["api-bindings", "science"]
exclude = [
  "xtask",
  ".github",
  ".cargo",
  ".config",
  "rust-toolchain.toml",
  "vendor/mlx-c/README.md",
  "vendor/mlx-c/docs",
]

[lib]
name = "mlx_c_rust"

[lints.rust]
# This crate exists to encapsulate the one unsafe boundary in the workspace:
# every MLX-C extern call lives here behind owned handles and checked statuses.
unsafe_code = "allow"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
thiserror = "2"

[features]
default = ["link"]
# The `link` feature carries the build script's entire link ladder, first
# match wins: the prefix variable, Homebrew, pkg-config, and finally the
# machine-shared zero-configuration pair. Consumers who provide their OWN
# native MLX build — for example a pinned, patched fork from their own native
# orchestration —
# depend with default-features = false and get the bindings-only mode: the
# vendored-header declarations, the captured-error translation, the owned
# handle types, and the operation wrapper families, with zero link
# directives. They own the linker; this crate must not select a library
# for them or trigger side effects like compiling the pinned pair.
link = []

[build-dependencies]
bindgen = "0.73"
pkg-config = "0.3"
# Verifies the pinned source tarballs of the automatic native build before
# compilation; pure Rust, no native build cost of its own.
sha2 = "0.11"

[dev-dependencies]
# The digest contracts include the shared native build engine as a source
# module, and the engine checksums with sha2.
sha2 = "0.11"

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]

# The repository tooling workspace: the root package is the published crate;
# xtask carries the typed build-native command (see .cargo/config.toml).
[workspace]
members = ["xtask"]
