name: 'mlx-bridge cache with restoration report'
description: 'Restores or saves one named CI cache and reports its outcome and duration, so a slow run shows which cache missed without reading the raw logs.'

inputs:
  operation:
    description: 'Whether to restore or save this cache.'
    required: true
  owner:
    description: 'Lowercase hyphenated cache owner used in the report.'
    required: true
  path:
    description: 'Paths to cache or restore.'
    required: true
  key:
    description: 'Primary cache key.'
    required: true
  restore-keys:
    description: 'Fallback restore-key prefixes.'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'Whether the restore operation hit the primary key exactly.'
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Start cache operation timer
      id: timer
      shell: bash
      run: printf 'started_at=%s\n' "$(date +%s)" >> "$GITHUB_OUTPUT"
    # A cache service outage must cost time, never the build, so both
    # operations tolerate failure and the report below makes it visible.
    - name: Restore cache
      id: restore
      if: ${{ inputs.operation == 'restore' }}
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs['restore-keys'] }}
    - name: Save cache
      id: save
      if: ${{ inputs.operation == 'save' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
    - name: Report cache operation
      shell: bash
      # Values reach the script through the environment, never through ${{ }}
      # interpolation into its body, so a key cannot inject shell syntax.
      env:
        CACHE_OWNER: ${{ inputs.owner }}
        CACHE_OPERATION: ${{ inputs.operation }}
        CACHE_OUTCOME: ${{ inputs.operation == 'restore' && steps.restore.outcome || steps.save.outcome }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        CACHE_MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        CACHE_STARTED_AT: ${{ steps.timer.outputs.started_at }}
      run: |
        printf '[cache] owner=%s operation=%s outcome=%s exact_hit=%s matched_key=%s elapsed_seconds=%s\n' \
          "$CACHE_OWNER" "$CACHE_OPERATION" "$CACHE_OUTCOME" "${CACHE_HIT:-n/a}" \
          "${CACHE_MATCHED_KEY:-none}" "$(( $(date +%s) - CACHE_STARTED_AT ))"
